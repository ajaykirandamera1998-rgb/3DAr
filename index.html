<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>90's MACHINE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      touch-action: manipulation;
    }

    /* Keep MindAR's own camera feed / canvas full-screen and behind the
       AR scene. Scoped to MindAR's own classed elements only -- do not
       widen this to a blanket "video" selector, that's what caused a
       black-screen bug in an earlier build by fighting MindAR's own
       internal styling. */
    video.mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
      display: block !important;
      background: transparent !important;
    }

    canvas.mindar-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
      display: block !important;
      pointer-events: none !important;
    }

    a-scene, .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
      display: block !important;
      background: transparent !important;
    }

    .a-enter-vr, .a-enter-ar, .a-orientation-modal, .a-loader-title {
      display: none !important;
    }

    /* ------------------------------------------------------------- */
    /* Entry screen -- same retro system as MEMEVERSE                */
    /* ------------------------------------------------------------- */

    #entry-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #f2e6c9;
    }
    #entry-screen.hidden { display: none; }

    #entry-sunburst {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220vw;
      height: 220vw;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(#1b6b67 0deg 9deg, #7a2426 9deg 18deg);
      opacity: 0.18;
    }

    #entry-title {
      position: relative;
      margin: 0;
      color: #7a2426;
      font-family: "Baloo 2", sans-serif;
      font-size: clamp(40px, 13vw, 64px);
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 0.95;
      text-shadow: 4px 4px 0 #e8a62e, 7px 7px 0 #241a14;
    }

    #entry-subtitle {
      position: relative;
      margin-top: 14px;
      padding: 7px 22px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #1b6b67;
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    #entry-hint {
      position: relative;
      max-width: 300px;
      margin: 26px 0 0;
      color: #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.8;
    }

    #entry-btn {
      position: relative;
      margin-top: 22px;
      padding: 14px 38px;
      border: 3px solid #241a14;
      border-radius: 999px;
      background: #e8a62e;
      color: #241a14;
      box-shadow: 4px 4px 0 #241a14;
      font-family: "Fredoka", sans-serif;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    #entry-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #241a14;
    }

    /* ------------------------------------------------------------- */
    /* Scan HUD                                                      */
    /* ------------------------------------------------------------- */

    #scan-hud {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #scan-hud.visible { opacity: 1; }

    #scan-frame {
      position: relative;
      width: 58vw;
      max-width: 320px;
      aspect-ratio: 1 / 1.15;
    }

    #scan-frame .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid #1b6b67;
      animation: scan-pulse 1.8s ease-in-out infinite;
    }
    @keyframes scan-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    #scan-frame .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
    #scan-frame .tr { top: 0; right: 0; border-bottom: none; border-left: none; border-radius: 0 10px 0 0; }
    #scan-frame .bl { bottom: 0; left: 0; border-top: none; border-right: none; border-radius: 0 0 0 10px; }
    #scan-frame .br { right: 0; bottom: 0; border-top: none; border-left: none; border-radius: 0 0 10px 0; }

    #scan-hint {
      position: absolute;
      bottom: -44px;
      left: 50%;
      padding: 6px 16px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      font-family: "Fredoka", sans-serif;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ------------------------------------------------------------- */
    /* Error toast                                                   */
    /* ------------------------------------------------------------- */

    #ar-error-toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      z-index: 110;
      display: none;
      max-width: 86vw;
      padding: 12px 18px;
      border-radius: 14px;
      transform: translateX(-50%);
      background: rgba(20, 10, 8, 0.94);
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
    #ar-error-toast.visible { display: block; }

    /* ------------------------------------------------------------- */
    /* Ambient particles while scanning                              */
    /* ------------------------------------------------------------- */

    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: 44;
      overflow: hidden;
      pointer-events: none;
    }
    .ambient-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1b6b67;
      opacity: 0;
    }

    /* ------------------------------------------------------------- */
    /* Cafe brand watermark -- bottom corner, transparent background */
    /* ------------------------------------------------------------- */

    #brand-watermark {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 42;
      pointer-events: none;
      background: transparent;
      color: #f7efd9;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 0 6px rgba(0, 0, 0, 0.35);
      opacity: 0.92;
    }
  </style>
</head>

<body>
  <div id="entry-screen">
    <div id="entry-sunburst"></div>
    <h1 id="entry-title">90's MACHINE</h1>
    <div id="entry-subtitle">Touch the Past, Feel the Memory</div>
    <p id="entry-hint">Point your camera at the wall, then tap below to begin.</p>
    <button id="entry-btn" type="button">Tap to Begin</button>
  </div>

  <div id="scan-hud">
    <div id="scan-frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="scan-hint">Point at an object on the wall</div>
    </div>
  </div>

  <div id="ambient-layer"></div>
  <div id="ar-error-toast"></div>
  <div id="brand-watermark">90&#8217;s Cafe, Khammam</div>

  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: targets.mind;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      autoStart: false;
    "
    color-space="sRGB"
    renderer="
      alpha: true;
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <!-- PLACEHOLDER MODELS -- swap these two a-asset-item src paths for
           your real objects (coin-box phone, cassette, etc.) once you have
           them exported as .gltf/.glb. Everything else below (roster,
           listeners, reveal animation) stays the same -- just add more
           <a-asset-item> + more target entities the same way. -->
      <a-asset-item id="model-0" src="coin.gltf"></a-asset-item>
     
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 0: placeholder (swap for e.g. "Coin-Box Phone") -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0">
      <a-entity
        id="model-entity-0"
        gltf-model="#model-0"
        rotation="0 0 0"
        position="0 -0.25 0"
        scale="0.05 0.05 0.05"
        animation-mixer
      ></a-entity>
    </a-entity>

    <!-- 1: placeholder (swap for e.g. "Cassette Tape") -->
    <a-entity id="target-1" mindar-image-target="targetIndex: 1">
      <a-entity
        id="model-entity-1"
        gltf-model="#model-1"
        rotation="0 0 0"
        position="0 -0.25 0"
        scale="0.05 0.05 0.05"
        animation-mixer
      ></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector("#ar-scene");
    const entryScreen = document.querySelector("#entry-screen");
    const entryBtn = document.querySelector("#entry-btn");
    const scanHud = document.querySelector("#scan-hud");
    const errorToast = document.querySelector("#ar-error-toast");
    const ambientLayer = document.querySelector("#ambient-layer");

    // One entry per object. Add more objects later by adding a row here,
    // one more <a-asset-item>, and one more <a-entity mindar-image-target>
    // block above with the next targetIndex.
    const ROSTER = [
      { index: 0, name: "Placeholder (raccoon) -- swap for Coin-Box Phone" },
      { index: 1, name: "Placeholder (bear) -- swap for Cassette Tape" }
    ];

    const targets = ROSTER.map(({ index, name }) => ({
      index,
      name,
      targetEntity: document.querySelector(`#target-${index}`),
      modelEntity: document.querySelector(`#model-entity-${index}`)
    }));

    let hasStartedAR = false;
    let activeIndex = null;

    /* ------------------------------------------------------------- */
    /* Web Audio UI sounds -- same pattern as MEMEVERSE               */
    /* ------------------------------------------------------------- */

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playTone({ freq = 880, endFreq = null, duration = 0.2, type = "triangle", volume = 0.25 }) {
      const ctx = getAudioCtx();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, ctx.currentTime);
      if (endFreq) oscillator.frequency.exponentialRampToValueAtTime(endFreq, ctx.currentTime + duration * 0.6);

      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + duration + 0.05);
    }

    const playTapSound = () => playTone({ freq: 420, endFreq: 620, duration: 0.15, type: "sine", volume: 0.2 });
    const playLockOnChime = () => playTone({ freq: 620, endFreq: 980, duration: 0.28, type: "triangle", volume: 0.28 });

    /* ------------------------------------------------------------- */
    /* Entry screen animation                                        */
    /* ------------------------------------------------------------- */

    gsap.set("#entry-title, #entry-subtitle, #entry-hint, #entry-btn", { opacity: 0 });
    gsap.set("#entry-title", { scale: 0.7 });
    gsap.to("#entry-sunburst", { rotate: 360, duration: 50, repeat: -1, ease: "none" });

    gsap.timeline()
      .to("#entry-title", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.1)
      .to("#entry-subtitle", { opacity: 1, duration: 0.4 }, 0.4)
      .to("#entry-hint", { opacity: 1, duration: 0.4 }, 0.6)
      .to("#entry-btn", { opacity: 1, duration: 0.4 }, 0.75);

    sceneEl.addEventListener("arReady", () => {
      errorToast.classList.remove("visible");
    });

    sceneEl.addEventListener("arError", (event) => {
      console.error("90's MACHINE: MindAR camera error:", event.detail);
      errorToast.textContent = "Camera could not start. Allow camera permission and open this site using HTTPS or localhost.";
      errorToast.classList.add("visible");
    });

    entryBtn.addEventListener("click", async () => {
      try {
        const ctx = getAudioCtx();
        if (ctx.state === "suspended") await ctx.resume();
        playTapSound();

        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (mindarSystem && !hasStartedAR) {
          hasStartedAR = true;
          await mindarSystem.start();
        }

        gsap.to("#entry-screen", {
          opacity: 0,
          scale: 1.05,
          duration: 0.4,
          ease: "power1.in",
          onComplete: () => {
            entryScreen.classList.add("hidden");
            if (activeIndex === null) {
              scanHud.classList.add("visible");
              startAmbientParticles();
            }
          }
        });
      } catch (error) {
        console.error("90's MACHINE: Start error:", error);
        errorToast.textContent = "Could not open the camera. Please allow camera permission, then reload.";
        errorToast.classList.add("visible");
      }
    });

    /* ------------------------------------------------------------- */
    /* Reveal / hide -- objects pop in with an elastic overshoot,     */
    /* same feel as MEMEVERSE's frame+video pop-in.                  */
    /* ------------------------------------------------------------- */

    function revealSequence(t) {
      if (t.modelEntity && t.modelEntity.object3D) {
        gsap.killTweensOf(t.modelEntity.object3D.scale);
        t.modelEntity.object3D.rotation.set(0, 0, 0); // start each reveal from neutral

        gsap.fromTo(
          t.modelEntity.object3D.scale,
          { x: 0.0005, y: 0.0005, z: 0.0005 },
          { x: 0.05, y: 0.05, z: 0.05, duration: 0.5, ease: "elastic.out(1, 0.55)" }
        );
      }
    }

    function hideSequence(t) {
      if (t.modelEntity && t.modelEntity.object3D) {
        gsap.killTweensOf(t.modelEntity.object3D.scale);

        gsap.to(t.modelEntity.object3D.scale, {
          x: 0.0005, y: 0.0005, z: 0.0005,
          duration: 0.2,
          ease: "power1.in"
        });
      }
    }

    /* ------------------------------------------------------------- */
    /* Finger drag-to-rotate -- Sketchfab-style manual orbit. The     */
    /* object stays still until the visitor actually drags; it never */
    /* spins on its own. Works with touch AND mouse via Pointer       */
    /* Events, and only rotates whichever object is currently active */
    /* (activeIndex), since only one is ever visible at a time.       */
    /* ------------------------------------------------------------- */

    const DRAG_SENSITIVITY_Y = 0.008;  // left/right drag -> spin around vertical axis
    const DRAG_SENSITIVITY_X = 0.006;  // up/down drag -> tilt forward/back
    const TILT_LIMIT = Math.PI / 3;    // clamp tilt to +-60deg so it can't flip upside down

    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    function getActiveModelObject3D() {
      if (activeIndex === null) return null;
      const active = targets.find((t) => t.index === activeIndex);
      return active && active.modelEntity ? active.modelEntity.object3D : null;
    }

    document.addEventListener("pointerdown", (event) => {
      if (activeIndex === null) return; // nothing visible to rotate yet
      isDragging = true;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;
    });

    document.addEventListener("pointermove", (event) => {
      if (!isDragging) return;

      const obj3D = getActiveModelObject3D();
      if (!obj3D) return;

      const deltaX = event.clientX - lastPointerX;
      const deltaY = event.clientY - lastPointerY;
      lastPointerX = event.clientX;
      lastPointerY = event.clientY;

      obj3D.rotation.y += deltaX * DRAG_SENSITIVITY_Y;

      obj3D.rotation.x += deltaY * DRAG_SENSITIVITY_X;
      obj3D.rotation.x = Math.max(-TILT_LIMIT, Math.min(TILT_LIMIT, obj3D.rotation.x));
    });

    function endDrag() {
      isDragging = false;
    }
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);
    document.addEventListener("pointerleave", endDrag);

    // Same single-active-target guard as MEMEVERSE -- avoids two objects
    // popping in simultaneously if the camera briefly catches two targets.
    targets.forEach((t) => {
      if (!t.targetEntity) return;

      t.targetEntity.addEventListener("targetFound", () => {
        if (activeIndex !== null && activeIndex !== t.index) return;

        console.log(`90's MACHINE: Target found - ${t.name}`);
        activeIndex = t.index;

        scanHud.classList.remove("visible");
        stopAmbientParticles();

        playLockOnChime();
        revealSequence(t);
      });

      t.targetEntity.addEventListener("targetLost", () => {
        if (activeIndex !== t.index) return;

        console.log(`90's MACHINE: Target lost - ${t.name}`);
        activeIndex = null;

        hideSequence(t);

        if (entryScreen.classList.contains("hidden")) {
          scanHud.classList.add("visible");
          startAmbientParticles();
        }
      });
    });

    /* ------------------------------------------------------------- */
    /* Ambient particles while scanning                              */
    /* ------------------------------------------------------------- */

    let ambientTimer = null;

    function spawnAmbientDot() {
      const dot = document.createElement("div");
      dot.className = "ambient-dot";

      const x = window.innerWidth * (0.3 + Math.random() * 0.4);
      const startY = window.innerHeight * 0.75;
      dot.style.left = `${x}px`;
      dot.style.top = `${startY}px`;
      ambientLayer.appendChild(dot);

      gsap.timeline({ onComplete: () => dot.remove() })
        .to(dot, { opacity: 0.6, duration: 0.4 }, 0)
        .to(dot, { y: -180 - Math.random() * 100, x: `+=${(Math.random() - 0.5) * 60}`, duration: 2.4, ease: "power1.out" }, 0)
        .to(dot, { opacity: 0, duration: 0.5 }, 1.9);
    }

    function startAmbientParticles() {
      if (ambientTimer) return;
      spawnAmbientDot();
      ambientTimer = window.setInterval(spawnAmbientDot, 700);
    }

    function stopAmbientParticles() {
      if (ambientTimer) {
        window.clearInterval(ambientTimer);
        ambientTimer = null;
      }
    }

    /* Start every object hidden until its target is found */
    sceneEl.addEventListener("loaded", () => {
      targets.forEach((t) => {
        if (t.modelEntity && t.modelEntity.object3D) {
          t.modelEntity.object3D.scale.set(0.0005, 0.0005, 0.0005);
        }
      });
    });
  </script>
</body>
</html>
